# настройки пользовательского интерфейса
[gui]
tables = index,spec,bom,sds,sds2

# Общие настройки таблиц
[table]
# Разделитель в объединенных позиционных обозначениях (C2-C4, C3...C5) 
ref separator = -
# Объединять группы с одинаковыми наименованиями (ПЭ3)
concatenate same name groups = yes
# Добавить единицы измерения
add units = yes
# Добавить пробел перед единицами измерения
space before units = yes
# Заголовок со стандартом
title with doc = no
# Проставлять заголовки классов
put class header = yes
# Добавить пустую строку после заголовка класса
empty row after class title = yes
# В каждой группе есть заголовок
every group has title = yes
# Добавить пустую строку после заголовка группы
empty row after group title = no
# Количество пустых строк между группами
empty rows between diff type = 1
# Количество пустых строк между разными обозначениями (ПЭ3)
empty rows between diff ref = 1
# Разделить группы по стандартам
separate group for each doc = no
# Зарезервировать номера позиций
reserve position numbers = no
# Нумеровать строки только для компонентов (ВП)
only components have position numbers = no
# Обрабатывать повторяющиеся значения (ВП)
process repeated values = no

# Разделы спецификации
[sections]
# 1. Документация (+ вариант исполнения)
documentation = yes
# Схема электрическая принципиальная
schematic = yes
schematic_variant = yes
schematic_default_format = А3
# Перечень элементов
index = yes
index_variant = yes
# Ведомость покупных изделий
bom = no
bom_variant = yes
# Ведомость документов на носителях данных
docsheet = no
docsheet_variant = no
# Информационно-удостоверяющий лист
certsheet = no
certsheet_variant = no
# Карты рабочих режимов
opmodemaps = no
opmodemaps_variant = no
# Сборочный чертеж
assembly drawing = yes
assembly drawing_variant = yes
assembly drawing_default_format = А3
# 2. Сборочные единицы
assembly units = no
# 3. Детали
details = yes
# Плата печатная (+ вариант исполнения)
pcb = yes
pcb_variant = no
# 4. Стандартные изделия
standard parts = no
# 5. Прочие изделия
other parts = yes
# 6. Материалы
materials = no

# Общие поля таблиц
[fields]
# Регулируемый компонент
adjustable = Подбирают при регулировании

# Поля перечня элементов
[fields_index]
# Класс (супергруппа компонентов)
class = _Class
# Тип (группа компонентов)
type = _Subclass
# Наименование
#name = ${|Comment|, }${|_FType|, }${|Size|, }${|Color|, }${|Number of capacitors| × }${|Number of resistors| × }${|_Value|}${ |Tolerance|}${ × |Rated voltage|}${ × |Rated current|}${, |TC|}
name = name
# Стандарт
doc = Стандарт
# Примечание
comment = Примечание

# Поля спецификации
[fields_spec]
# Класс (супергруппа компонентов)
class = _Class
# Тип (группа компонентов)
type = _Subclass
# Обозначение
number = Comment
# Наименование
name = ${|_FType|, }${|Size|, }${|Color|, }${|Number of capacitors| × }${|Number of resistors| × }${|_Value|}${ |Tolerance|}${ × |Rated voltage|}${ × |Rated current|}${, |TC|}
# Стандарт
doc = Стандарт
# Примечание
comment = Примечание

# Поля ведомости покупных изделий
[fields_bom]
# Класс (супергруппа компонентов)
class = _Class
# Тип (группа компонентов)
type = _Subclass
# Наименование
name = ${|Comment|, }${|_FType|, }${|Size|, }${|Color|, }${|Number of capacitors| × }${|Number of resistors| × }${|_Value|}${ |Tolerance|}${ × |Rated voltage|}${ × |Rated current|}${, |TC|}
# Код продукции
code = 
# Стандарт
doc = Стандарт
# Поставщик
dealer = 
# Куда входит (обозначение)
for what = _Designator
# Примечание
comment = Примечание

# Поля SDS Компэл
[fields_sds]
# Обозначение
number = Comment
# Производитель
vendor = Manufacturer
# Примечание
comment = Примечание

# Основная надпись
[stamp]
# Обработать наименование документа
convert doc title = yes
# Обработать обозначение документа
convert doc id = yes
# Заполнить Перв. примен. (графа 25)
fill first usage = yes
# Поместить обозначение в заголовок таблицы (для групповых документов)
place doc id to table title = yes

# Псевдонимы
[aliases]
_Value = 

# Настройки модулей вывода
[output]
# Путь к стилевым пакетам
latex_path = latex/
# Путь к шаблонам
template_path = template/
# Разделитель в файлах CSV
csv_delimiter = ,
# Формат экспорта по умолчанию
default_type = pdf

# Форматы группового экспорта для различных типов документов
[export]
index = pdf
spec = pdf
bom = pdf
sds = csv

# Дополнительные типы компонентов и их формы множественного числа
[custom_types]
Резистор постоянный                = Резисторы постоянные
Конденсатор пленочный              = Конденсаторы пленочные
Конденсатор керамический           = Конденсаторы керамические
Конденсатор танталовый             = Конденсаторы танталовые
Конденсатор электролитический      = Конденсаторы электролитические
Конденсатор проходной керамический = Конденсаторы проходные керамические
Суперконденсатор                   = Суперконденсаторы
Ферритовая бусина                  = Ферритовые бусины
Индуктивность высокочастотная      = Индуктивности высокочастотные
Индуктивность силовая              = Индуктивности силовые
Светодиод					       = Светодиоды
